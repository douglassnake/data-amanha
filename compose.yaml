services:
  observatorio:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18501:8501"
    environment:
      TZ: America/Sao_Paulo
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=10001,gid=10001
    volumes:
      - streamlit_home:/home/appuser
volumes:
  streamlit_home:
