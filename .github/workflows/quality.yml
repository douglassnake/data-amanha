name: Validação do observatório
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe Python
        run: python -m py_compile app.py
      - name: Conferir integridade e cobertura do dataset ilustrativo
        run: |
          python - <<'PYCODE'
          import csv
          from pathlib import Path
          path=Path('data/dataset_global_1900_2026.csv')
          with path.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert [int(row['year']) for row in rows] == list(range(1900,2027)), 'Esperados anos 1900 a 2026'
          required={'orbital','war','climate','economy','politics','science','demography','health','global_index'}
          assert required.issubset(rows[0]), f'Faltam colunas: {required-set(rows[0])}'
          for row in rows:
              assert all(0<=float(row[k])<=5 for k in ('war','climate','economy','politics','science','demography','health'))
          print(f'VALIDADO: {len(rows)} anos com scores heurísticos')
          PYCODE
